
name: Build APK Radio Dewi Anjani Universal

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Flutter Project
        run: |
          set -e
          unzip -q Radio_Dewi_Anjani001.zip -d app

          test -f app/pubspec.yaml
          test -f app/lib/main.dart

          echo "Source Flutter berhasil diekstrak."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Image Tools
        run: pip install Pillow

      - name: Prepare Official Radio Logo
        run: |
          set -e
          mkdir -p app/assets/icon

          SOURCE_LOGO=""

          if [ -f "logo_radio.png" ]; then
            SOURCE_LOGO="logo_radio.png"
          elif [ -f "logo_radio.jpg" ]; then
            SOURCE_LOGO="logo_radio.jpg"
          elif [ -f "logo_radio.jpeg" ]; then
            SOURCE_LOGO="logo_radio.jpeg"
          else
            SOURCE_LOGO=$(find app/assets -type f \
              \( -iname 'logo_radio.png' \
              -o -iname 'logo_radio.jpg' \
              -o -iname 'logo_radio.jpeg' \) \
              -print -quit)
          fi

          if [ -z "$SOURCE_LOGO" ] || [ ! -f "$SOURCE_LOGO" ]; then
            echo "ERROR: Logo Radio Dewi Anjani tidak ditemukan."
            echo "Daftar file gambar yang tersedia:"
            find app -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \)
            exit 1
          fi

          echo "Logo ditemukan: $SOURCE_LOGO"
          export SOURCE_LOGO

          python - <<'PY'
          import os
          from PIL import Image

          source = os.environ["SOURCE_LOGO"]

          img = Image.open(source).convert("RGB")
          img.thumbnail((460, 460), Image.Resampling.LANCZOS)

          canvas = Image.new("RGB", (512, 512), "white")
          x = (512 - img.width) // 2
          y = (512 - img.height) // 2
          canvas.paste(img, (x, y))

          canvas.save(
              "app/assets/icon/logo_radio.png",
              "PNG",
              optimize=True
          )

          canvas.save(
              "app/assets/logo_radio.jpg",
              "JPEG",
              quality=90,
              optimize=True
          )

          print("Logo resmi berhasil disiapkan.")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android
        working-directory: app
        run: flutter create . --platforms=android

      - name: Install Icon Generator
        working-directory: app
        run: flutter pub add --dev flutter_launcher_icons

      - name: Configure App Icon
        working-directory: app
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/logo_radio.png"
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/icon/logo_radio.png"
            min_sdk_android: 21
          EOF

      - name: Install Packages
        working-directory: app
        run: flutter pub get

      - name: Generate App Icon
        working-directory: app
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build Universal APK
        working-directory: app
        run: flutter build apk --release

      - name: Check APK
        working-directory: app
        run: |
          echo "HASIL BUILD APK:"
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Dewi-Anjani-Universal-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
